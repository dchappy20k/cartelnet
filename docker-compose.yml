services:
  postgres:
    image: postgres:16-alpine
    container_name: cartelnet-db
    environment:
      POSTGRES_USER: cartelnet
      POSTGRES_PASSWORD: cartelnet_password
      POSTGRES_DB: cartelnet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartelnet -d cartelnet"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cartelnet-api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://cartelnet:cartelnet_password@postgres:5432/cartelnet
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cartelnet-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
